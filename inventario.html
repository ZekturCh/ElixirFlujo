<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Inventario | Lightman Admin</title>

  <link rel="stylesheet" href="./assets/css/global.css" />
</head>
<body>

  <div id="app-header"></div>

  <main class="page">

    <section class="hero-panel">
      <div>
        <p class="eyebrow">Base de datos</p>
        <h1>Inventario</h1>
        <p class="hero-text">
          Control de trajes, artefactos, accesorios, precios, categorías y disponibilidad.
        </p>
      </div>

      <div class="hero-status">
        <span class="status-dot"></span>
        <span id="inventory-count">Cargando inventario...</span>
      </div>
    </section>

    <section class="admin-layout">

      <form id="inventory-form" class="admin-form">
        <h2>Agregar item</h2>

        <div class="form-grid">
          <label>
            Detalle / Nombre
            <input 
              type="text" 
              id="item-nombre" 
              placeholder="Ej: Traje Tijeras LED"
              required
            />
          </label>

          <label>
            Categoría
            <select id="item-categoria" required>
              <option value="">Seleccionar categoría</option>
              <option value="Traje LED">Traje LED</option>
              <option value="Artefacto LED">Artefacto LED</option>
              <option value="Batería">Batería</option>
              <option value="Controlador">Controlador</option>
              <option value="Cableado">Cableado</option>
              <option value="Equipo técnico">Equipo técnico</option>
              <option value="Estructura">Estructura</option>
              <option value="Reparación">Reparación</option>
              <option value="Otro">Otro</option>
            </select>
          </label>

          <label>
            Cantidad total
            <input 
              type="number" 
              id="item-cantidad" 
              min="0" 
              value="1"
              required
            />
          </label>

          <label>
            ¿Tiene precio propio?
            <select id="item-tiene-precio">
              <option value="si">Sí, se cobra por separado</option>
              <option value="no">No, va incluido en otro item</option>
            </select>
          </label>

          <label>
            Precio de renta normal
            <input 
              type="number" 
              id="item-precio-renta" 
              min="0" 
              step="0.01"
              value="0"
            />
          </label>

          <label>
            Precio preferencial
            <input 
              type="number" 
              id="item-precio-preferencial" 
              min="0" 
              step="0.01"
              value="0"
            />
          </label>
        </div>

        <label>
          Observaciones
          <textarea 
            id="item-observaciones" 
            rows="3"
            placeholder="Ej: Las baterías van incluidas dentro del precio del traje."
          ></textarea>
        </label>

        <button type="submit" class="primary-btn">
          Guardar en inventario
        </button>

        <p id="form-message" class="form-message"></p>
      </form>

      <section class="admin-list">
        <div class="section-head">
          <div>
            <p class="eyebrow">Lista</p>
            <h2>Items registrados</h2>
          </div>
        </div>

        <div id="inventory-list" class="cards-list">
          <p class="empty-text">Cargando items...</p>
        </div>
      </section>

    </section>

  </main>

  <script type="module" src="./assets/js/layout.js"></script>
  <script type="module" src="./assets/js/inventario.js"></script>
</body>
</html>
